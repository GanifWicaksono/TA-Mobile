name: carelink
description: "CareLink - Aplikasi Keselamatan Lansia Berbasis Deteksi Jatuh Sensorik & Notifikasi Darurat"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  sensors_plus: ^5.0.1
  geolocator: ^12.0.0
  intl: ^0.19.0
  provider: ^6.1.2
  shared_preferences: ^2.2.3
  uuid: ^4.4.0
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/images/
